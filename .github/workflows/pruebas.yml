name: Pruebas de regresión

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (regresión F-01)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias de la API y de prueba
        # bcrypt<5: passlib 1.7.4 falla al importar con bcrypt 5.x (ver docs/SECURITY.md, F-12)
        run: python -m pip install fastapi python-jose passlib "bcrypt==4.0.1" python-multipart httpx pytest
      - name: Ejecutar pruebas
        env:
          SECRET_KEY: clave-efimera-solo-para-ci
        run: pytest -q tests
