name: DAST pasivo - app local en el runner

# Levanta la API dentro del runner de GitHub (localhost) con usuarios y clave
# EFIMEROS y la analiza con OWASP ZAP en modo pasivo (-S: sin ataques activos).
# No toca ningun sistema externo: es la alternativa "baseline local" del Lab 5.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap-local:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias de la API
        # bcrypt==4.0.1: passlib 1.7.4 falla con bcrypt 5.x (ver docs/SECURITY.md, F-05)
        run: python -m pip install fastapi uvicorn python-jose passlib "bcrypt==4.0.1" python-multipart

      - name: Generar secretos efimeros (solo viven en este job)
        run: |
          python - <<'PY'
          import json, os, secrets
          from passlib.context import CryptContext
          ctx = CryptContext(schemes=["bcrypt"])
          key = secrets.token_hex(32)
          pwd = secrets.token_urlsafe(16)
          users = {"analista": {"role": "analyst", "hashed_password": ctx.hash(pwd)}}
          for v in (key, pwd):
              print("::add-mask::" + v)
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"SECRET_KEY={key}\n")
              f.write(f"APP_USERS={json.dumps(users)}\n")
              f.write(f"ANALISTA_PWD={pwd}\n")
          PY

      - name: Arrancar la API en localhost
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/openapi.json > /dev/null && exit 0
            sleep 1
          done
          echo "La API no arranco:"; cat uvicorn.log; exit 1

      - name: Login de laboratorio y dato ficticio
        run: |
          TOKEN=$(curl -sf -d "username=analista&password=$ANALISTA_PWD" \
            http://127.0.0.1:8000/token | python -c "import sys,json; print(json.load(sys.stdin)['access_token'])")
          echo "::add-mask::$TOKEN"
          echo "ZAP_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          curl -sf -X POST http://127.0.0.1:8000/alertas \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d '{"id":1,"host":"host-ficticio","severity":"low","indicator_type":"malware"}' > /dev/null

      - name: ZAP API scan pasivo (OpenAPI de la app)
        run: |
          mkdir -p reports && chmod 777 reports
          docker run --rm --network host \
            -e ZAP_AUTH_HEADER=Authorization \
            -e ZAP_AUTH_HEADER_VALUE="Bearer $ZAP_TOKEN" \
            -v "$PWD/reports:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py -t http://localhost:8000/openapi.json -f openapi \
            -O http://localhost:8000 -S -r zap-report.html -J zap-report.json -I || true

      - name: Adjuntar resultados
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: informe-zap-local
          path: |
            reports/
            uvicorn.log
          if-no-files-found: warn