# /etc/nginx/sites-available/muvautomation
#
# Laboratorio 3 - Parte 2 - Fase: Migracion HTTP -> HTTPS.
# Reverse proxy hacia el backend FastAPI (Falcon Incident Hub) en localhost:8000.
# Certificado real emitido por Let's Encrypt via Tailscale (tailscale cert).
#
# Riesgos del Lab 3 que esto resuelve (ver risk-register.md):
#   - R5: confidencialidad del trafico -> TLS cifra todo en transito.
#   - R6: integridad del trafico -> TLS protege contra tampering en transito.
# Sigue pendiente: R3 (escritura no autenticada), R7 (repudiation),
# R10 (sin roles) -> se resuelven en los siguientes pasos de Lab 3 - Parte 2
# (autenticacion e identidad).

# --- Bloque 1: HTTP (puerto 80) -> solo redirige a HTTPS ---
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name fdsi.tail61fc9f.ts.net;

    # Redireccion permanente a HTTPS, conservando la ruta solicitada
    return 301 https://$host$request_uri;
}

# --- Bloque 2: HTTPS (puerto 443) ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name fdsi.tail61fc9f.ts.net;

    # --- Certificado (Let's Encrypt via Tailscale) ---
    ssl_certificate     /etc/nginx/ssl/fdsi.crt;
    ssl_certificate_key /etc/nginx/ssl/fdsi.key;

    # --- Solo TLS 1.2 y 1.3 (se descartan 1.0/1.1, inseguros) ---
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

    # Cache de sesion TLS para mejorar rendimiento en reconexiones
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    # --- R1: ocultar version de Nginx (heredado de Fase E, Lab 3) ---
    server_tokens off;

    # --- R2: headers de seguridad (heredado de Fase E, Lab 3) ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # --- Nuevo en Lab 3 - Parte 2: forzar HTTPS en el navegador por 6 meses ---
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

    # --- R11: restringir /docs y /openapi.json (heredado de Fase E, Lab 3) ---
    location ~ ^/(docs|openapi\.json) {
        allow 192.168.15.0/24;   # LAB_CIDR (segmento local, Fase A)
        allow 100.80.65.73;      # Tailscale - laptop-d03enf55 (Red Team)
        allow 100.94.32.120;     # Tailscale - kawaki (equipo)
        deny all;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Habilitar:
#   sudo ln -s /etc/nginx/sites-available/muvautomation /etc/nginx/sites-enabled/muvautomation
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# Retest sugerido:
#   curl -i http://fdsi.tail61fc9f.ts.net/alertas     -> esperar 301 a https://
#   curl -i https://fdsi.tail61fc9f.ts.net/alertas    -> esperar 200 OK, cert valido
#   curl -Iv https://fdsi.tail61fc9f.ts.net/alertas 2>&1 | grep -i "SSL connection\|subject\|issuer"
