# /etc/nginx/sites-available/muvautomation
#
# Laboratorio 3 - Fase E: Hardening inicial de Nginx.
# Reverse proxy hacia el backend FastAPI (Falcon Incident Hub) en localhost:8000.
# Sigue sin TLS ni autenticacion (limite explicito del Lab 3, R3/R5/R6/R7/R10
# quedan pendientes para el Laboratorio 4).
#
# Cambios aplicados en esta fase (ver risk-register.md):
#   - R1: server_tokens off -> oculta la version de Nginx en los headers.
#   - R2: headers de seguridad (X-Content-Type-Options, X-Frame-Options,
#         Referrer-Policy) agregados a toda respuesta.
#   - R11: /docs y /openapi.json restringidos a LAB_CIDR + IPs Tailscale
#         fijas del equipo, denegados para cualquier otro origen.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # --- R1: ocultar version de Nginx ---
    server_tokens off;

    # --- R2: headers de seguridad para todas las respuestas ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # --- R11: restringir /docs y /openapi.json ---
    # Se permite acceso desde el segmento local del laboratorio (LAB_CIDR,
    # usado en Fase A) y desde las IPs Tailscale fijas del equipo (usadas
    # desde Fase C en adelante para las pruebas remotas). Cualquier otro
    # origen recibe 403 Forbidden.
    location ~ ^/(docs|openapi\.json) {
        allow 192.168.15.0/24;   # LAB_CIDR (segmento local, Fase A)
        allow 100.80.65.73;      # Tailscale - laptop-d03enf55 (Red Team)
        allow 100.94.32.120;     # Tailscale - kawaki (equipo)
        deny all;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# Habilitar:
#   sudo ln -s /etc/nginx/sites-available/muvautomation /etc/nginx/sites-enabled/muvautomation
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# Retest sugerido tras aplicar (Fase F):
#   curl -I http://$TARGET_IP/alertas        # verificar ausencia de "Server: nginx/x.x.x" version
#   curl -I http://$TARGET_IP/alertas        # verificar presencia de los 3 headers nuevos
#   curl -i http://$TARGET_IP/docs           # desde fuera de LAB_CIDR -> esperar 403 Forbidden
#   curl -i http://$TARGET_IP/openapi.json   # desde fuera de LAB_CIDR -> esperar 403 Forbidden
#   curl -i http://$TARGET_IP/docs           # desde dentro de LAB_CIDR -> esperar 200 OK
