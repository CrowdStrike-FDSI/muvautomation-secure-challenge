# /etc/nginx/sites-available/muvautomation
#
# Laboratorio 3 - Fase A: HTTP publico, sin autenticacion, sin TLS.
# Nginx actua como reverse proxy hacia el backend FastAPI (Falcon Incident Hub)
# que corre en localhost:8000 y NO debe exponerse directamente.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# Habilitar:
#   sudo ln -s /etc/nginx/sites-available/muvautomation /etc/nginx/sites-enabled/muvautomation
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t
#   sudo systemctl reload nginx
